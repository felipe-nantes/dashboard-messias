name: Verificar pacote publico
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DASH_AMBIENTE: publicacao
    steps:
      - uses: actions/checkout@v7
      - name: Configurar diretorios temporarios do executor
        run: |
          echo "R_LIBS_USER=$RUNNER_TEMP/r-library" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "RENV_PATHS_ROOT=$RUNNER_TEMP/renv" >> "$GITHUB_ENV"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - name: Dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev libcurl4-openssl-dev libssl-dev libxml2-dev
      - name: Restaurar dependencias registradas
        shell: Rscript {0}
        run: |
          dir.create(Sys.getenv('R_LIBS_USER'), recursive=TRUE, showWarnings=FALSE)
          install.packages('renv', repos='https://cloud.r-project.org')
          renv::restore(lockfile='renv.lock', library=Sys.getenv('R_LIBS_USER'), prompt=FALSE)
      - name: Validar dados e portabilidade
        run: Rscript --vanilla scripts/validar_pacote_publicacao.R
      - name: Verificar inicializacao da aplicacao
        shell: Rscript {0}
        run: |
          app <- source('app.R', encoding='UTF-8')$value
          stopifnot(inherits(app, 'shiny.appobj'))
